name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch
concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 24
      - uses: gradle/actions/setup-gradle@v6
      # Restore on every run, but only save from main so PR runs don't fill the repo's cache quota
      - name: Restore Kotlin/Native (konan) cache
        id: konan-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run shared tests on iOS simulator
        run: ./gradlew :common:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: "**/build/reports/tests/"

      - name: Build iOS app
        run: xcodebuild -workspace ios/FantasyPremierLeague/FantasyPremierLeague.xcodeproj/project.xcworkspace -configuration Debug -scheme FantasyPremierLeague -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO EXCLUDED_ARCHS=x86_64 -derivedDataPath build/dd build

      # Launch the app on a simulator and run the Maestro flow shared with the Android app, so
      # runtime crashes in the Kotlin/Swift interop fail CI
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.11.0

      # TEMP diagnostic: can the macOS runner reach the FPL API?
      - name: Check FPL API reachability
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w 'bootstrap-static: HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n' --max-time 60 https://fantasy.premierleague.com/api/bootstrap-static/
          curl -sS -o /dev/null -w 'fixtures: HTTP %{http_code}, %{time_total}s\n' --max-time 60 https://fantasy.premierleague.com/api/fixtures/

      - name: Run Maestro tests
        env:
          # Starting Maestro's iOS driver on a cold runner can take a few minutes (default limit ~2 min)
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/FantasyPremierLeague.app
          maestro --device "$UDID" test --debug-output maestro-debug -e APP_ID=dev.johnoreilly.FantasyPremierLeague maestro/FantasyPremierLeague.flow

      # takeScreenshot output: Maestro saves it under --debug-output's hidden .maestro directory
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-screenshot-ios
          path: maestro-debug/**/takeScreenshot/*.png
          include-hidden-files: true

      # TEMP diagnostic: the app's own log from the simulator
      - name: Collect app log
        if: failure()
        run: |
          mkdir -p maestro-debug
          xcrun simctl spawn booted log show --last 10m --style compact --predicate 'process == "FantasyPremierLeague"' > maestro-debug/app.log || true
          tail -50 maestro-debug/app.log || true

      - name: Collect iOS crash reports
        if: failure()
        run: |
          mkdir -p maestro-debug/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -name 'FantasyPremierLeague*' -exec cp {} maestro-debug/crash-reports/ \; || true

      # Maestro's logs, screenshots and view hierarchy, plus the app's crash report, to diagnose failures
      # (Maestro writes under a hidden .maestro directory, hence include-hidden-files)
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-debug-ios
          path: maestro-debug
          include-hidden-files: true

      - name: Save Kotlin/Native (konan) cache
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}
