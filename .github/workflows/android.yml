name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs for the same PR/branch
concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 24
      - uses: gradle/actions/setup-gradle@v6
      - name: Build android app
        run: ./gradlew assembleDebug
      - name: Run Unit Tests
        run: ./gradlew test
      # iOS Kotlin/Native is compiled by the iOS workflow (xcodebuild on macOS).
      # FantasyPremierLeague's Koog agent expect/actual only provides the Native
      # actual on a macOS host, so this target can't compile on the Linux runner.

  # Launch the app on an emulator and run the Maestro flow shared with the iOS app
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 24
      - uses: gradle/actions/setup-gradle@v6

      # Without this the runner user can't open /dev/kvm, so the emulator falls back to
      # unaccelerated software emulation, which is slow and flaky (APK installs time out).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build android app
        run: ./gradlew :app:assembleDebug

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        env:
          MAESTRO_VERSION: 2.11.0

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # minSdk is 35, so the emulator needs at least API 35
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            maestro test --debug-output maestro-debug -e APP_ID=dev.johnoreilly.fantasypremierleague maestro/FantasyPremierLeague.flow

      # takeScreenshot output: Maestro saves it under --debug-output's hidden .maestro directory
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-screenshot-android
          path: maestro-debug/**/takeScreenshot/*.png
          include-hidden-files: true

      # Maestro's logs, screenshots and view hierarchy, to diagnose failures
      # (Maestro writes under a hidden .maestro directory, hence include-hidden-files)
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-debug-android
          path: maestro-debug
          include-hidden-files: true
